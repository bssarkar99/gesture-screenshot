name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          if [ -f GestureScreenshot.zip ]; then
            unzip -o GestureScreenshot.zip -d .
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download gesture recognizer model
        run: |
          mkdir -p GestureScreenshot/app/src/main/assets
          curl -L -o GestureScreenshot/app/src/main/assets/gesture_recognizer.task \
            https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/latest/gesture_recognizer.task

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: GestureScreenshot
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GestureScreenshot-debug-apk
          path: GestureScreenshot/app/build/outputs/apk/debug/app-debug.apk
